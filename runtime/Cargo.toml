[package]
name = "duck-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Linux-side runtime for Microduck Nano on the Arduino UNO Q: talks to the microcontroller firmware and runs the control loop"
repository = "https://github.com/Trainnr-AI/microduck-nano"
publish = false

[[bin]]
name = "duckd"
path = "src/main.rs"

[dependencies]
# rigrs: joint descriptions and the guard that authorises every joint target. Pinned to a commit; see
# docs/project/rigrs-for-general-use.md for what we need changed upstream.
arm = { git = "https://github.com/Trainnr-AI/rigrs", rev = "548a4c9" }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "warn"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
