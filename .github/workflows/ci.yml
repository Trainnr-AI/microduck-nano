name: ci

on:
  push:
    paths: ["firmware/**", "runtime/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["firmware/**", "runtime/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generated config header is up to date
        run: python3 firmware/tools/gen_config.py --check
      - name: Unit tests (host build of the firmware core)
        run: make -C firmware/tests test
      - name: Leg-rule vectors for the Rust runtime are up to date
        run: make -C firmware/tests leg-vectors && git diff --exit-code runtime/tests/data/leg_rule_vectors.txt

  runtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests
        run: cargo test --locked --workspace
      - name: Lints (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
